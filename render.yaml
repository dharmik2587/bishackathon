services:
  - type: web
    name: bis-rag-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.api:app --host 0.0.0.0 --port 8000"
    healthCheckPath: "/api/results"
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PORT
        value: 8000

  - type: web
    name: bis-rag-frontend
    env: node
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm run preview -- --host 0.0.0.0 --port 3000"
    envVars:
      - key: VITE_API_URL
        value: "https://bis-rag-backend.onrender.com"
